<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Cleaner</title>
  <link rel="icon" type="image/png" href="static/title.png"/>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/default.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="static/html.png" width="32" height="32" alt="HTML Cleaner"/>
      <h1>HTML Cleaner</h1>
    </div>
    <button id="themeToggle" class="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle theme"><img id="themeIcon" src="static/light.png" width="24" height="24" alt="light"/></button>
  </header>

  <hr class="divider">

  <main class="workspace">
    <section class="panel">
      <div class="panel-header">INPUT HTML</div>
      <textarea id="inputArea" spellcheck="false" placeholder="Paste your junk HTML here..."></textarea>
      <div class="panel-footer">
        <button id="clearBtn" class="btn btn-outline"><img src="static/delete.png" width="18" height="18" alt="clear"/> CLEAR INPUT</button>
      </div>
    </section>

    <section class="center-col">
      <button id="convertBtn" class="btn-convert-circle" title="Clean HTML">
        <img src="static/lightning.png" width="28" height="28" alt="lightning"/>
        <span>CLEAN →</span>
      </button>
    </section>

    <section class="panel">
      <div class="panel-header">CLEANED OUTPUT</div>
      <textarea id="outputArea" spellcheck="false" readonly placeholder="Cleaned output appears here..."></textarea>
      <div class="panel-footer">
        <button id="copyBtn" class="btn btn-outline"><img src="static/copy.png" width="18" height="18" alt="copy"/> COPY TO CLIPBOARD</button>
      </div>
    </section>
  </main>

  <div id="entityBar" style="display:none">
    <select id="entityFormat">
      <option value="decimal">Decimal (&#225;)</option>
      <option value="hex">Hexadecimal (&#xE1;)</option>
      <option value="named">Named (&aacute;)</option>
    </select>
    <button id="replaceEntityBtn">Replace Entities</button>
  </div>

  <section class="stats-bar">
    <div class="stat">
      <span class="stat-label">ORIGINAL SIZE</span>
      <span class="stat-value" id="statOriginal">0 B</span>
    </div>
    <div class="stat">
      <span class="stat-label">CLEANED SIZE</span>
      <span class="stat-value" id="statCleaned">0 B</span>
    </div>
    <div class="stat">
      <span class="stat-label">REDUCTION %</span>
      <span class="stat-value" id="statReduction">0%</span>
    </div>
    <div class="stat">
      <span class="stat-label">PROCESS TIME</span>
      <span class="stat-value" id="statTime">0 ms</span>
    </div>
  </section>

  <footer class="site-footer">
    <p>Copyright &copy; 2026 | MoPower Information Services Pvt Ltd</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
